name: ominimo-blog

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "${DB_FORWARD_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-ominimo_blog}"
      MYSQL_USER: "${DB_USERNAME:-ominimo}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-ominimo_local}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-ominimo_root_local}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-ominimo_root_local}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_FORWARD_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  redis-data:
